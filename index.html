<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Método PND · Reta Final</title>
<meta name="description" content="App de estudo para a Prova Nacional Docente 2026.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f3b32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand"><span class="mark"></span>Método PND</div>
    <div class="sub">Reta final · da compra à prova</div>
    <div class="days-left" id="days-badge"></div>
  </header>

  <main id="main">
    <div class="empty"><p>Carregando conteúdo…</p></div>
  </main>

  <nav class="tabbar">
    <button data-tab="home" class="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
      Início
    </button>
    <button data-tab="mapas">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 4h6a4 4 0 014 4v12a3 3 0 00-3-3H2z"/><path d="M22 4h-6a4 4 0 00-4 4v12a3 3 0 013-3h7z"/></svg>
      Mapas
    </button>
    <button data-tab="questoes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
      Questões
    </button>
    <button data-tab="discursiva">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>
      Discursiva
    </button>
    <button data-tab="planner">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      Planner
    </button>
  </nav>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  // dias até a prova no header
  (function(){
    function upd(){
      const target = new Date('2026-09-20T00:00:00');
      const now = new Date(); now.setHours(0,0,0,0);
      const d = Math.ceil((target - now)/86400000);
      const el = document.getElementById('days-badge');
      if (el) el.innerHTML = `<b>${d>=0?d:0}</b><span>dias p/ prova</span>`;
    }
    upd();
  })();
</script>
</body>
</html>
